# CD — deploiement du backend sur simul.api.fintech4esg.com, DEPUIS GitHub,
# uniquement quand la CI de main est VERTE. Rien de tiers : openssh du runner, cle
# fournie par secret, hote verifie par empreinte (jamais de
# StrictHostKeyChecking=no — un DevSecOps ne deploie pas vers un hote
# qu'il ne reconnait pas).
#
# Secrets requis (Settings -> Secrets and variables -> Actions) :
#   DEPLOY_HOST         152.53.118.110 (ou le nom DNS)
#   DEPLOY_USER         l'utilisateur SSH de deploiement
#   DEPLOY_SSH_KEY      la cle privee ed25519 DEDIEE au deploiement
#   DEPLOY_KNOWN_HOSTS  la ligne `ssh-keyscan` du serveur (l'empreinte)
# Variable optionnelle :
#   DEPLOY_PATH         chemin du depot sur le serveur
#                       (defaut /home/apps/loader)
name: Deploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Redeploiement manuel (bouton « Run workflow ») sans commit factice.
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    # Chaine auto : uniquement si la CI est verte. Manuel : toujours autorise.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Preparer la cle et l'empreinte de l'hote
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deployer (pull ff-only, build natif ARM64, sante verifiee)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'FIN'
          set -euo pipefail
          cd "${DEPLOY_PATH:-/home/apps/loader}"
          git fetch origin main
          git merge --ff-only origin/main
          # --- Provisionnement du .env serveur DEPUIS les secrets GitHub ---
          # Le .env est gitignore : git ne le porte jamais. Les valeurs vivent
          # en secrets (Settings -> Actions) et le CD les ENFORCE a chaque
          # deploiement — idempotent, remplace la ligne si elle existe, l'ajoute
          # sinon. GitHub masque les valeurs dans les logs ; l'empreinte sha256
          # tronquee suffit a prouver QUELLE cle est en place sans la montrer.
          touch .env
          cp -n .env .env.sauvegarde-avant-mailjet-20260820 || true
          maj_env() {
            cle="$1"; val="$2"
            if [ -z "$val" ]; then
              echo "ECHEC : secret ${cle} vide ou absent — .env laisse intact"
              exit 1
            fi
            if grep -q "^${cle}=" .env; then
              sed -i "s|^${cle}=.*|${cle}=${val}|" .env
            else
              printf '%s=%s\n' "${cle}" "${val}" >> .env
            fi
          }
          maj_env MAILJET_API_KEY '${{ secrets.MAILJET_API_KEY }}'
          maj_env MAILJET_SECRET_KEY '${{ secrets.MAILJET_SECRET_KEY }}'
          maj_env MAILJET_EXPEDITEUR '${{ secrets.MAILJET_EXPEDITEUR }}'
          # --- Identifiants ROOT de la plateforme FinZuu ---
          # AJOUTES LE 14/09/2026, apres un incident mesure le jour meme.
          # Le Loader deploye repondait `500` sur toutes ses routes FinZuu
          # (/admin/inventaire/groupes, /companies, /produits) alors que la
          # meme version en local joignait les 9 services : son `.env` portait
          # un mot de passe ROOT perime.
          # Ce n'est pas qu'une panne, c'est une panne CONTAGIEUSE : `INV-USR-19`
          # verrouille le compte ROOT — PARTAGE par tous les consommateurs — au
          # TROISIEME refus. Un serveur reste en arriere verrouille donc la
          # plateforme pour TOUT LE MONDE, tout seul.
          # Le mot de passe ROOT cesse ici d'etre pose a la main sur le serveur :
          # une valeur posee a la main derive, et sa derive verrouille FinZuu.
          # UNE source — le secret — ENFORCEE a chaque deploiement.
          maj_env ROOT_USERNAME '${{ secrets.ROOT_USERNAME }}'
          maj_env ROOT_PASSWORD '${{ secrets.ROOT_PASSWORD }}'
          echo "empreinte mdp ROOT en place : $(printf '%s' '${{ secrets.ROOT_PASSWORD }}' | sha256sum | cut -c1-12)"
          # Pas un secret — une VERITE DE TOPOLOGIE : ce backend est derriere
          # nginx, X-Forwarded-For y est pose par NOTRE proxy. Sans ce flag,
          # l'anti-brute-force par source et l'IP du journal (28/08) verraient
          # l'adresse de nginx, pas celle de la personne.
          maj_env FAIRE_CONFIANCE_PROXY 'true'
          echo "empreinte api-key en place : $(printf '%s' '${{ secrets.MAILJET_API_KEY }}' | sha256sum | cut -c1-12)"
          # compose hache la config (.env inclus) : le conteneur est recree
          # si les valeurs ont change, laisse en place sinon.
          docker compose up -d --build
          # La preuve, jamais la deduction : /health doit repondre 200.
          # Port 8003 (8000 est pris par finzuu-talk-recording — recon 14/08).
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8003/health >/dev/null 2>&1; then
              echo "sante OK apres ${i} tentative(s)"
              exit 0
            fi
            sleep 2
          done
          echo "ECHEC : /health muet apres 60 s — voir docker compose logs loader"
          docker compose logs --tail 50 loader
          exit 1
          FIN
        env:
          # Defaut /home/apps/loader ; DEPLOY_USER attendu = apps (groupes
          # sudo+docker), PAS root — on ne deploie pas une app sous root sur
          # un serveur partage (recon 14/08).
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
