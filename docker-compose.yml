# Loader FinZuu — la pile de production sur simul.fintech4esg.com.
#
# DEUX conteneurs, pas plus : le backend et SA memoire. La MongoDB du Loader
# (registre Faker, org_hierarchy, journal, configuration) EST l'etat du
# projet — d'ou le volume nomme, sauvegarde par mongodump (cf.
# docs/DEPLOIEMENT.md §5) et JAMAIS expose hors du reseau interne.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - loader_mongo_data:/data/db
    # AUCUN port publie : la memoire du Loader n'est joignable que par lui.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  loader:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # A l'interieur de la pile, la base s'appelle par son nom de service —
      # ecrase la valeur localhost du .env sans la modifier.
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # 127.0.0.1:8003 — LE PORT 8000 EST DEJA PRIS (recon serveur du 14/08 :
      # `finzuu-talk-recording` de Nextcloud ecoute sur 0.0.0.0:8000). Publier
      # sur 8000 aurait fait echouer `up` (address already in use). 8003 est
      # libre. Loopback SEULEMENT : le nginx du HOST (vhost simul.fintech4esg
      # deja en place, cert Let's Encrypt valide) proxifie le 443 vers ce port.
      - "127.0.0.1:8003:8000"

networks:
  # Reseau `loader-net` DEJA PRE-CREE sur le serveur (recon du 14/08, vide et
  # pret) : on l'adopte plutot que d'en fabriquer un doublon. Chaque app du
  # VPS partage est isolee dans son propre reseau — on respecte le motif.
  default:
    name: loader-net
    external: true

volumes:
  loader_mongo_data:
