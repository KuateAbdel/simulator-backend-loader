# Vhost BACKEND — simul.api.fintech4esg.com -> Loader FinZuu (127.0.0.1:8003)
#
# Decision Option B (Yaniv, 14/08) : le backend a SON sous-domaine, comme la
# Newsletter (news.api). Le frontend de Zidane reste sur simul.fintech4esg.com
# (vhost simul.conf, qu'on ne touche pas).
#
# A poser dans /etc/nginx/sites-available/ puis lier dans sites-enabled/.
# Le certificat s'obtient AVANT le reload (certbot --webroot, cf. DEPLOIEMENT.md).

server {
    listen 80;
    server_name simul.api.fintech4esg.com;

    # Laisse passer le challenge ACME (renouvellement du certificat).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste bascule en HTTPS.
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name simul.api.fintech4esg.com;

    ssl_certificate     /etc/letsencrypt/live/simul.api.fintech4esg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simul.api.fintech4esg.com/privkey.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
